# Spring boot
server.port=28080

# PubSub consumer: started only by the wiring test; destinations are never auto-created
nisaba.pubsub.consumer.enabled=false
entur.pubsub.subscriber.autocreate=false
nisaba.pubsub.project.id=test
marduk.pubsub.project.id=test
spring.cloud.gcp.project-id=${nisaba.pubsub.project.id}
# unreachable on purpose: no test uses application default credentials; the wiring test points at the emulator
spring.cloud.gcp.pubsub.emulator-host=localhost:1
# non-default values, so that the property test cannot pass vacuously
spring.cloud.gcp.pubsub.subscriber.executor-threads=1
spring.cloud.gcp.pubsub.subscriber.flow-control.max-outstanding-element-count=1
spring.cloud.gcp.pubsub.subscriber.max-ack-extension-period=3600
entur.pubsub.consumer.retry.delay=100
logging.level.io.grpc.internal.ManagedChannelOrphanWrapper=OFF

# Local redelivery and drain
nisaba.redelivery.max=0
nisaba.shutdown.drain.timeout.seconds=2

# Kafka: the real clients are replaced by test doubles in the test profile
nisaba.kafka.topic.event=rutedata-dataset-import-event-dev
nisaba.kafka.topic.idempotent=rutedata-dataset-import-event-idempotent-repo-dev
spring.kafka.bootstrap-servers=localhost:1
spring.kafka.properties.schema.registry.url=mock://nisaba
spring.kafka.admin.auto-create=false

# Blob store
blobstore.gcs.marduk.container.name=marduk
blobstore.gcs.nisaba.exchange.container.name=nisaba-exchange
blobstore.local.folder=target/blobstore
blobstore.gcs.project.id=test

# Monitoring
management.endpoints.access.default=none
management.health.pubsub.enabled=false
management.endpoints.web.exposure.exclude=*
management.endpoints.jmx.exposure.exclude=*
